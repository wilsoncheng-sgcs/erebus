#VRML_SIM R2022b utf8
# tags: static
PROTO FloorVictim [
    field SFVec3f    translation   0 0 0
    field SFRotation rotation      0 1 0 0
    field SFBool     found         FALSE
    field SFString   name          "FloorVictim"
    field SFString   type          "harmed"
    field SFInt32    scoreWorth    10
    field SFFloat    size          0.05
]
{
    # Purely a logical/scoring marker - holds position, type, scoreWorth and
    # found state for the supervisor's detection code (see Victim.py's
    # FloorVictim class), with no visible geometry of its own.
    #
    # An earlier version rendered a small coloured box here directly, but
    # any nonzero height/offset needed to avoid it being hidden by the
    # opaque tile floor also moved it measurably closer to a robot's
    # downward colour sensor (mounted on the underside of the robot), which
    # for some valid low-mounted sensor builds pushed the marker inside the
    # camera's near-clipping distance and caused missed detections - even
    # though the floor's own colour, at its own established depth, was
    # detected fine. Rather than tune a protrusion small enough to dodge
    # z-fighting but large enough to avoid the clip plane (a moving target
    # across different robot builds), the visible colour patch is instead
    # rendered as part of worldTile's own floor surface (see
    # worldTile.proto's victimType/victimTexture fields) - the exact same
    # depth the floor is already proven to render reliably at, for any
    # sensor that can see the floor at all.
    #
    # The `size` field is kept for interface/API stability (map editors may
    # still populate it) but is unused now that there's no geometry to size.
    Pose {
        translation IS translation
        rotation IS rotation
        children [
            Solid {
                name IS name
            }
        ]
    }
}
