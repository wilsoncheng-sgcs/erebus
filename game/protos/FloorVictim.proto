#VRML_SIM R2022b utf8
# tags: static
PROTO FloorVictim [
    field SFVec3f    translation   0 0 0
    field SFRotation rotation      0 1 0 0
    field SFBool     found         FALSE
    field SFString   name          "FloorVictim"
    field SFString   type          "harmed"
    field SFInt32    scoreWorth    10
    field SFFloat    size          0.05
]
{
    %{
        colour = "0.85 0.1 0.1"
        if fields.type.value == "harmed" then
            colour = "0.85 0.1 0.1"
        end
        if fields.type.value == "unharmed" then
            colour = "0.1 0.75 0.1"
        end
        if fields.type.value == "stable" then
            colour = "0.9 0.85 0.1"
        end
    }%
    Pose {
        translation IS translation
        rotation IS rotation
        children [
            Solid {
                # Sits clearly ABOVE the floor's top surface (the passed-in
                # translation) with a deliberate 1mm air gap, rather than
                # flush/recessed into it. An earlier version centered this
                # box on the floor surface (half recessed) to minimise
                # visual protrusion, on the theory that it might physically
                # hinder robot movement - but this Shape has no
                # boundingObject, so it was never a real physics collider,
                # and the razor-thin (0.5mm) result put it right at the
                # edge of low-mounted colour sensors' near-clipping plane,
                # causing missed detections on some valid robot builds
                # (confirmed empirically: a sensor mounted close to the
                # floor failed to detect it, and detected reliably once
                # given more clearance). Prioritise reliable detection
                # across any reasonable sensor mounting height over a
                # marginal cosmetic reduction in protrusion.
                translation 0 0.002 0
                children [
                    Shape {
                        appearance Appearance {
                            material Material {
                                diffuseColor %{=colour}%
                            }
                        }
                        geometry DEF FLOORVICTIMBOX Box {
                            size %{=fields.size.value}% 0.002 %{=fields.size.value}%
                        }
                        isPickable  FALSE
                    }
                ]
                name IS name
            }
        ]
    }
}
